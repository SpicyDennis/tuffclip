<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TUFFClip · Capture card</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="capture.css" />
</head>
<body>
<video id="feed" autoplay playsinline disablepictureinpicture></video>

<div class="empty cap-empty" id="capEmpty">
  <div>
    <p class="empty-title" id="capTitle">Looking for your capture card…</p>
    <p class="empty-sub" id="capSub"></p>
    <button class="btn sm" id="capRetry" hidden>Try again</button>
  </div>
</div>

<header class="cap-bar" id="capBar">
  <label class="cap-field">Card <select id="videoSel" aria-label="Capture card"></select></label>
  <label class="cap-field">Sound <select id="audioSel" aria-label="Sound from"></select></label>
  <label class="cap-field">Volume <input type="range" id="volume" min="0" max="1" step="0.05" aria-label="Volume"></label>
  <div class="status" id="capStatus"><span class="tally" aria-hidden="true"></span><span id="capStatusText">Not recording</span></div>
  <button class="btn sm" id="fsBtn" title="Fullscreen gives the sharpest recording">Fullscreen<kbd>F11</kbd></button>
</header>

<script src="capture.js"></script>
</body>
</html>
